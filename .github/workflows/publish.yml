name: Publish

# A version bump on main publishes it. npm trusts this workflow directly
# (trusted publishing), so there's no npm token to store or rotate.
on:
  push:
    branches: [main]
    paths: [packages/tiao/package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Check whether this version is already on npm
        id: version
        run: |
          version=$(node -p "require('./packages/tiao/package.json').version")
          if npm view "@nightmarket/tiao@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: pnpm test && pnpm typecheck
      - if: steps.version.outputs.publish == 'true'
        working-directory: packages/tiao
        run: npm publish --access public
