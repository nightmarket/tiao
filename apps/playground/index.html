<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tiao</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* the global Font setting's ABC Areal option; the file is licensed, so
         it lives in the gitignored public/fonts/ and 404s harmlessly without it */
      @font-face {
        font-family: 'ABC Areal Superfamily Variable';
        src: url('/fonts/ABCArealSuperfamilyVariable.woff2') format('woff2');
        font-weight: 400 700;
        font-style: oblique 0deg 12deg;
        font-display: swap;
      }
      /* native scrollbars and form controls in the dark theme; a thin thumb with no track */
      html {
        color-scheme: dark;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* 98.5% black */
        background: #040404;
        color: #e8e8ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
